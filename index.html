<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friendship CRM</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Friendship CRM">
<meta name="theme-color" content="#1F3A5F">
<style>
:root{--bg:#DCEBFA;--navy:#1F3A5F;--ink:#15233A;--mute:#4A5E78}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100%;padding:24px;background-image:radial-gradient(circle at 50% 28%,#fff 0%,var(--bg) 62%)}
.splash{text-align:center;max-width:320px}
.logo{width:96px;height:96px;display:block;margin:0 auto 18px;border-radius:22px}
h1{margin:0 0 8px;font-size:22px;line-height:1.2;color:var(--navy)}
p{margin:0 0 20px;font-size:14px;color:var(--mute)}
a{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:10px;min-height:44px}
a:focus{outline:2px solid var(--navy);outline-offset:3px}
</style>
</head>
<body>
  <div class="splash">
    <img class="logo" src="logo-header.png" width="96" height="96" alt="">
    <h1>Friendship CRM</h1>
    <p>Opening your CRM…</p>
    <a href="https://script.google.com/macros/s/AKfycbxVtJj0fTJfwkGf507W-1q7goiJv0e15ISUyGxaKkQGuefviDB9XJ1qGqJozzfCa70v6A/exec">Open Friendship CRM</a>
  </div>
  <script>
    location.replace("https://script.google.com/macros/s/AKfycbxVtJj0fTJfwkGf507W-1q7goiJv0e15ISUyGxaKkQGuefviDB9XJ1qGqJozzfCa70v6A/exec");
  </script>
</body>
</html>
